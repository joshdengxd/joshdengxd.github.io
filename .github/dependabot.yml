# Dependency updates as small PRs that go through `checks`; patch and minor ones merge on their own once `checks` passes, the owner merges the rest.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # No labels: the repo keeps only the workflow labels.
    labels: []
    groups:
      # Minor and patch updates in one PR; majors stay separate PRs.
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors held back for now (#2).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: []
    groups:
      # Minor and patch action updates in one PR (auto-merged when `checks` passes, see dependabot-auto-merge.yml);
      # each action major stays its own PR for the owner.
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
