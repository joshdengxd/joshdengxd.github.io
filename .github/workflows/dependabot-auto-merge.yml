name: dependabot-auto-merge

# Turns on GitHub auto-merge for Dependabot patch and minor PRs; the ruleset still requires `checks` to pass.
# Majors, failed checks and every non-Dependabot PR wait for the owner. Keep the plain `pull_request` trigger.
on: pull_request

permissions: {}

jobs:
  # Not named `checks`: it must never satisfy or shadow the required check.
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.actor == 'dependabot[bot]'
      && github.repository == 'joshdengxd/joshdengxd.github.io'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
